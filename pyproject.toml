[project]
name = "atlas-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ryan Taylor", email = "ryan@beta-reduce.net" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
atlas-rag = "atlas_rag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "httpx2>=2.16.0",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]
