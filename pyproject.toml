[project]
name = "atlas-review"
version = "0.1.0"
description = "Local MITRE ATLAS security review RAG for AI application designs"
readme = "README.md"
authors = [
    { name = "Ryan Taylor", email = "ryan@beta-reduce.net" }
]
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.16",
    "fastembed>=0.9.1",
    "msgspec>=0.19",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "pydantic>=2,<3",
    "pyyaml>=6",
    "rich>=13",
    "rustworkx>=0.18.1",
    "tokenizers>=0.23.3",
    "usearch>=2.26.6",
]

[project.scripts]
atlas-review = "atlas_review:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "atlas_review"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket -m 'not smoke'"
markers = [
    "smoke: requires model downloads and network access (opt-in)",
    "llm: makes live provider requests (opt-in with --llm)",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "httpx2>=2.16.0",
    "hypothesis>=6.170.15",
    "interrogate>=1.7.0",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
    "vulture>=2.16",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "RUF",  # Ruff-specific
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
    "N",    # pep8-naming
    "PERF", # Perflint
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "TRY",  # tryceratops
    "DTZ",  # flake8-datetimez
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "PL",   # Pylint
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501",   # long strings; the formatter owns code wrapping
    "EM101",  # message variables keep the error taxonomy in one place
    "EM102",
    "TRY003", # errors are raised with structured fields, not one long literal
    "ANN401", # YAML boundary values are deliberately Any
    "D101",   # Pydantic models are documented by their field descriptions
    "D102",
    "D105",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 6  # parse context travels together through the corpus validators

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",
    "S101",
    "S105",
    "S106",
    "PLR2004",
    "TRY003",
]
"src/atlas_review/corpus/normalize.py" = ["ARG002"]  # HTMLParser hooks ignore attributes
"src/atlas_review/config.py" = ["S105"]  # "token" appears in field names
"src/atlas_review/retrieval/pipeline.py" = ["PLR0913"]  # one run takes its loaded inputs

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["bm25s"]
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportMissingModuleSource = false
# Third-party stubs (yaml, hypothesis) erase these types at the boundary.
# mypy strict already requires explicit annotations.
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownVariableType = false

[tool.deptry]
known_first_party = ["atlas_review"]

[tool.deptry.package_module_name_map]
pyyaml = "yaml"

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80  # imports, unused arguments, unreachable code
ignore_names = [
    "attrs",      # HTMLParser handler signature
    "exc_type",   # __exit__ signature
    "traceback",
]

[tool.interrogate]
# Docstring coverage. Tests are excluded: they document behavior by assertion.
exclude = ["tests"]
fail-under = 80  # floor to raise as docstring coverage grows
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-private = true
ignore-semiprivate = true
verbose = 0
